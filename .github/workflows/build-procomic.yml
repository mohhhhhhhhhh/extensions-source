name: Build ProComic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

        - name: Fetch ProComic PR
        run: |
          git fetch https://github.com/keiyoushi/extensions-source.git pull/16421/head:procomic-pr
          git checkout procomic-pr

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ProComic
        run: |
          chmod +x ./gradlew
          ./gradlew :src:ar:procomic:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProComic-APK
          path: src/ar/procomic/build/outputs/**/*.apk
          if-no-files-found: error
